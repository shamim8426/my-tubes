<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Pop;src:url("../../../shared/fonts/Poppins-ExtraBold.ttf");font-weight:800}
@font-face{font-family:Pop;src:url("../../../shared/fonts/Poppins-Bold.ttf");font-weight:700}
@font-face{font-family:Mono;src:url("../../../shared/fonts/IBMPlexMono-Bold.ttf")}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a3d91}
#stage{position:relative;width:1080px;height:1920px;font-family:Pop,sans-serif;color:#fff;
 background:radial-gradient(900px 700px at 90% 15%,rgba(120,255,255,.35),transparent 60%),
            radial-gradient(800px 800px at 5% 90%,rgba(90,60,255,.45),transparent 60%),
            linear-gradient(160deg,#0a3d91,#16c6d9)}
.abs{position:absolute}
h1{font-weight:800;font-size:120px;letter-spacing:-2px;text-shadow:0 6px 22px rgba(0,0,0,.35)}
.chip{font-family:Mono;font-size:54px;padding:14px 34px;border-radius:26px;background:rgba(8,10,24,.62);border:3px solid #bdf3ff;color:#bdf3ff;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.node{width:860px;height:178px;left:110px;border-radius:40px;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);
 border:2px solid rgba(255,255,255,.55);box-shadow:0 26px 60px rgba(0,0,0,.35);display:flex;align-items:center;gap:34px;padding:0 44px}
.node .n{flex:none;width:96px;height:96px;border-radius:50%;background:#ffda4a;color:#0a2c6b;font-weight:800;font-size:60px;display:flex;align-items:center;justify-content:center}
.node .t{font-weight:700;font-size:54px;line-height:1.15}
.node .t b{color:#ffda4a;font-weight:800}
.link{font-family:Mono;font-size:38px;padding:16px 34px;border-radius:999px;background:#fff;color:#0a2c6b;box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;gap:18px;align-items:center}
.link i{width:34px;height:34px;border-radius:50%;background:#16c6d9;display:inline-block}
.status{font-family:Mono;font-size:44px;padding:16px 38px;border-radius:20px;background:#0b1020;color:#7CFFB2;border:2px solid #2a3a66}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
path{fill:none;stroke:#ffda4a;stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
</style></head>
<body><div id="stage">
 <h1 id="title" class="abs" style="left:0;width:1080px;text-align:center;top:120px">Plan Mode</h1>
 <div id="key" class="abs chip" style="left:360px;top:300px">Shift + Tab</div>
 <div id="n1" class="abs node" style="top:470px"><div class="n">1</div><div class="t">You give <b>a task</b></div></div>
 <div id="n2" class="abs node" style="top:730px"><div class="n">2</div><div class="t">Claude <b>reads files</b></div></div>
 <div id="n3" class="abs node" style="top:990px"><div class="n">3</div><div class="t">Claude <b>proposes a plan</b></div></div>
 <div id="n4" class="abs node" style="top:1250px"><div class="n">4</div><div class="t">You <b>approve</b>, then edits start</div></div>
 <svg id="svg"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill:#ffda4a;stroke:none;filter:none"/></marker></defs>
  <path id="c1" d="M540,650 L540,730" marker-end="url(#ah)"/><path id="c2" d="M540,910 L540,990" marker-end="url(#ah)"/><path id="c3" d="M540,1170 L540,1250" marker-end="url(#ah)"/></svg>
 <div id="status" class="abs status" style="left:300px;top:1475px">⏸ plan mode on</div>
 <div id="link" class="abs link" style="left:120px;top:1600px"><i></i>code.claude.com/docs/en/common-workflows</div>
</div>
<script>
const E=id=>document.getElementById(id), c=x=>Math.max(0,Math.min(1,x));
const out=p=>1-Math.pow(1-p,3), back=p=>{const a=1.70158,b=a+1;return 1+b*Math.pow(p-1,3)+a*Math.pow(p-1,2)};
function pop(el,t0,t,dy=70){const p=c((t-t0)/0.55);el.style.opacity=c(p*1.8);el.style.transform=`translateY(${(1-out(p))*dy}px) scale(${.86+.14*back(p)})`}
function setT(t){
  pop(E('title'),0.0,t,40); pop(E('key'),0.35,t,40);
  [['n1',0.8],['n2',1.8],['n3',2.8],['n4',3.8]].forEach(([id,t0])=>pop(E(id),t0,t));
  [['c1',1.45],['c2',2.45],['c3',3.45]].forEach(([id,t0])=>{const p=E(id);const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-out(c((t-t0)/0.4)));p.style.opacity=t>=t0?1:0});
  pop(E('status'),4.4,t,30); pop(E('link'),4.9,t,30);
  // slow drift so nothing is ever fully static
  E('stage').style.backgroundPosition=`${Math.sin(t*0.5)*18}px ${t*6}px`;
}
setT(0);
</script></body></html>
