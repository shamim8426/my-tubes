<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;font-family:'Poppins','Inter',system-ui,sans-serif}
body{width:1500px;height:1100px;background:#000000;overflow:hidden}
.win{position:absolute;left:30px;top:30px;width:1440px;height:1040px;background:#121212;border-radius:26px;border:1px solid #2A2A2A;box-shadow:0 30px 90px rgba(217,119,87,.10);overflow:hidden;display:flex}
.side{width:300px;background:#0C0C0C;border-right:1px solid #262626;padding:26px 18px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:Georgia,serif;font-size:30px;color:#D97757;padding:6px 12px 22px}
.item{padding:13px 16px;border-radius:12px;font-size:21px;color:#B9B6AE;display:flex;gap:12px;align-items:center}
.item.on{background:#1E1E1E;color:#fff;font-weight:600}
.item.hl{background:#D97757;color:#111;font-weight:700}
.dot{width:18px;height:18px;border-radius:5px;background:#3A3A3A}
.main{flex:1;position:relative;padding:34px 44px}
h1{font-family:Georgia,serif;font-weight:500;font-size:40px;color:#F2F2F2}
.btn{position:absolute;right:44px;top:34px;background:#1E1E1E;border:1.5px solid #D97757;color:#F4C9B8;padding:14px 26px;border-radius:12px;font-size:21px;font-weight:600}
.btn.hl{background:#D97757;color:#111}
.cards{display:flex;gap:22px;margin-top:40px}.card{width:300px;height:170px;border:1px solid #2E2E2E;border-radius:18px;padding:20px;background:#181818;color:#EEE}
.card b{font-size:22px;color:#F2F2F2}.card p{font-size:16px;color:#8A8A8A;margin-top:8px}
.modal{position:absolute;left:300px;top:140px;width:760px;background:#1B1B1B;border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.7);padding:34px;border:1px solid #333;color:#EEE}
.modal h2{font-family:Georgia,serif;font-weight:500;font-size:30px;margin-bottom:22px}
label{font-size:17px;color:#9A9A9A;display:block;margin:14px 0 6px}
.field{border:2px solid #D8D4C6;border-radius:12px;padding:14px 16px;font-size:21px;min-height:54px;color:#F2F2F2}
.field.act{border-color:#D97757;box-shadow:0 0 0 4px rgba(217,119,87,.30)}
.row{display:flex;justify-content:flex-end;gap:14px;margin-top:26px}.b2{padding:13px 26px;border-radius:12px;font-size:20px;border:2px solid #3A3A3A;color:#BBB}.b3{padding:13px 26px;border-radius:12px;font-size:20px;background:#D97757;color:#111;font-weight:700}.b3.hl{background:#FFB59B;color:#111;box-shadow:0 0 0 5px rgba(217,119,87,.4)}
.chat{position:absolute;left:44px;top:110px;width:760px}.panel{position:absolute;right:0;top:0;bottom:0;width:430px;background:#0E0E0E;border-left:1px solid #262626;padding:30px}
.panel h3{font-size:24px;font-weight:700;color:#F2F2F2}.sub{font-size:16px;color:#777;margin-top:6px}.plus{position:absolute;right:30px;top:28px;width:46px;height:46px;border-radius:12px;background:#1E1E1E;border:1.5px solid #D97757;color:#F4C9B8;font-size:34px;text-align:center;line-height:42px}
.plus.hl{background:#D97757;color:#111}.file{margin-top:16px;background:#181818;border:1px solid #2E2E2E;border-radius:12px;padding:14px;font-size:18px;color:#EEE}
.link{margin-top:24px;font-size:20px;font-weight:600;color:#D97757;padding:12px 16px;border-radius:12px;border:2px dashed #7A4636;display:inline-block}.link.hl{background:#D97757;color:#111;border-style:solid}
.cursor{position:absolute;width:34px;height:34px;z-index:9;transform:translate(-4px,-2px)}
.tag{position:absolute;left:60px;bottom:44px;font-size:17px;color:#9A9A9A;background:rgba(30,30,30,.9);padding:8px 16px;border-radius:999px}
</style></head><body><div class="win" id="w">
<div class="side"><div class="brand">Assistant</div><div class="item"><span class="dot"></span>New chat</div><div class="item"><span class="dot"></span>Chats</div><div class="item" id="s_proj"><span class="dot"></span>Projects</div><div class="item"><span class="dot"></span>Artifacts</div></div>
<div class="main" id="main"></div></div>
<svg class="cursor" id="cur" viewBox="0 0 24 24"><path d="M3 2l16 9-7 2-3 7z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>
<div class="tag">Illustration built from the official help steps, not a screen recording</div>
<script>
const M=document.getElementById('main'),S=document.getElementById('s_proj'),C=document.getElementById('cur');
function ui(st){S.className='item'+(st.sideHl?' hl':'')+(st.sideOn?' on':'');
 let h='';
 if(st.page==='projects'){h+=`<h1>Projects</h1><div class="btn${st.btnHl?' hl':''}">+ New Project</div><div class="cards"><div class="card"><b>Study notes</b><p>Exams</p></div><div class="card"><b>Home budget</b><p>Monthly</p></div></div>`;}
 if(st.modal){h+=`<div class="modal"><h2>Create a project</h2><label>Project name</label><div class="field${st.f==='n'?' act':''}">${st.name||''}</div><label>Description</label><div class="field${st.f==='d'?' act':''}">${st.desc||''}</div><div class="row"><div class="b2">Cancel</div><div class="b3${st.createHl?' hl':''}">Create project</div></div></div>`;}
 if(st.page==='project'){h+=`<h1>${st.name||'My project'}</h1><div class="chat"><div class="file" style="background:#181818">Start a chat in this project…</div></div><div class="panel"><h3>Project knowledge</h3><div class="sub">Used in all chats of this project</div><div class="plus${st.plusHl?' hl':''}">+</div>${(st.files||[]).map(f=>`<div class="file">📄 ${f}</div>`).join('')}<div class="link${st.insHl?' hl':''}">Set project instructions</div>${st.ins?`<div class="file" style="margin-top:14px;border-color:#D97757">${st.ins}</div>`:''}</div>`;}
 M.innerHTML=h;C.style.left=(st.cx||0)+'px';C.style.top=(st.cy||0)+'px';C.style.opacity=st.cx==null?0:1;}
window.ui=ui;
</script></body></html>
