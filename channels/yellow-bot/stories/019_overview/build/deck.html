  mk(R,'left:880px;top:110px;font-size:44px;font-weight:800;width:150px;text-align:right;line-height:1.55','','abs').id='railn'}
window.SFX=D.sfx||scenes.map(s=>s.start);

function applyItem(it,lt){
  if(it.kind==='words'){const el=it.el;if(lt<it.t0){el.style.opacity=0;return}el.style.opacity=1;applyWords(it.ws,lt,it.t0,it.step,it.mode);return}
  const q0=c((lt-it.t0)/it.dur),q=eo(q0),el=it.el;
  if(q0<=0){el.style.opacity=0;return}
  const k=it.kind;
  if(k==='wipe'){el.style.setProperty('--w',(q*100)+'%');el.style.opacity=1;return}
  if(k==='type'){const f=el.dataset.full,n=Math.floor(q0*f.length);const t=f.slice(0,n);
    let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    h=h.replace(/^(\s*)([\w.\-\/]+:)/,(m,a,b)=>a+'<span style="color:#FFD60A">'+b+'</span>');
    if(/^\s*(---|#|\$)/.test(f))h='<span style="color:#aaa">'+h+'</span>';
    el.innerHTML=h+(q0<1?'<span style="color:#FFD60A">▌</span>':'');el.style.opacity=1;return}
  if(k==='robot'){const s2=.6+.4*back(c((lt-it.t0)/(it.dur*1.2)));el.style.opacity=Math.min(1,q*2);el.style.transform=`translateY(${Math.sin(lt*2.4)*10}px) rotate(${Math.sin(lt*1.6)*2.5}deg) scale(${s2})`;return}
  el.style.opacity=it.noFade?1:Math.min(1,q*2);
  if(k==='rise'){el.style.transform=`translateY(${(1-q)*(it.dy||70)}px)`}
  else if(k==='pop'){const s=.82+.18*back(c((lt-it.t0)/(it.dur*1.1)));el.style.transform=`scale(${s})`}
  else if(k==='left'){el.style.transform=`translateX(${-(1-q)*(it.dx||120)}px)`}
  else if(k==='right'){el.style.transform=`translateX(${(1-q)*(it.dx||120)}px)`}
  else if(k==='grow'){el.style[it.prop]=(q*it.to)+'px';if(it.rot!=null)el.style.transform=`rotate(${it.rot}deg)`}
}
function setT(t){
  E('bar').style.width=(W*c(t/D.total))+'px';
  let cur=-1;scenes.forEach((s,i)=>{if(t>=s.start&&t<s.end)cur=i});if(cur<0)cur=scenes.length-1;
  scenes.forEach((s,i)=>{s.root.style.display=i===cur?'block':'none'});

  // scene exit: gentle fade-down in the last 0.2 s
  const nf=scenes[cur+1]&&scenes[cur+1].wipe==='fade';
  const out=nf?1:c((sc.end-t)/.2);sc.root.style.opacity=cur===scenes.length-1?1:(.15+.85*out);
  if(D.rail){const n=scenes.length;E('railf').style.height=((1290)*c((cur+c(lt/(sc.end-sc.start)))/(n-1)))+'px';E('railn').textContent=(cur+1)+'/'+n}
  if(cur>0&&sc.wipe==='fade'&&lt<.25){const q=eio(lt/.25),pv=scenes[cur-1],pl=pv.end-pv.start-.001;pv.root.style.display='block';pv.anims.forEach(it=>applyItem(it,pl));if(pv.upd)pv.upd(pl);pv.root.style.opacity=1-q;sc.root.style.opacity=q}
  // yellow wipe at the start of every scene except the first
  const w=E('wipe');const wd=.42;
  if(cur>0&&lt<wd&&sc.wipe!=='fade'){const q=eio(lt/wd);w.style.display='block';const m=sc.wipe||'right';
    w.style.transform=m==='up'?`translateY(${-q*H}px)`:m==='left'?`translateX(${-q*W}px)`:`translateX(${q*W}px)`}else w.style.display='none';
}
setT(0);
